# Production compose for the Hostinger VPS (manager1).
# Deploy path: /opt/amiticia/ipp-sermons/  -- this file plus .env, no checkout.
# Reverse proxy: shared Traefik v3 on the external `network_public`, TLS via
# myresolver.
#
# Memory limits are not optional here. The box has 7.8 GB with roughly 2 GB
# free and no swap, and one existing container already holds 3.1 GB. Both
# services are capped so a runaway query cannot take the host down with it.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ipp-sermons-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ipp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ipp_sermons}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipp} -d ${POSTGRES_DB:-ipp_sermons}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    networks:
      - ipp_internal
    restart: unless-stopped

  # One-shot schema setup, applied as plain SQL by the postgres client.
  #
  # 000_schema.sql is generated from schema.prisma (prisma migrate diff) and
  # committed; 001 adds the pt_unaccent config, fts column, indexes and
  # hybrid_search(), then the browse facets. All are idempotent, so re-running a
  # deploy is safe. The loop applies every file in /sql in filename order rather
  # than a hard coded list -- the list was already wrong once, and a migration
  # that exists but is never applied fails silently in production.
  #
  # $$f, not $f: Compose interpolates $VAR itself before the shell ever sees
  # the command, so a single $ would expand to nothing and psql would be handed
  # an empty filename.
  #
  # Deliberately no Prisma CLI here. It is a devDependency that --prod strips,
  # and pulling it back in drags @prisma/engines and its own dependency chain
  # into the runtime image. `npx prisma` is worse still: it ignores the pinned
  # version and fetches the latest from the network (prisma 7 arrived here and
  # had dropped --skip-generate), so the migration could change shape between
  # deploys. Applying committed SQL is deterministic and needs no engine.
  migrate:
    image: postgres:16-alpine
    container_name: ipp-sermons-migrate
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./sql:/sql:ro
    command:
      [
        "sh",
        "-c",
        "for f in /sql/*.sql; do echo \"applying $$f\"; psql -h db -U ${POSTGRES_USER:-ipp} -d ${POSTGRES_DB:-ipp_sermons} -v ON_ERROR_STOP=1 -f \"$$f\" || exit 1; done",
      ]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - ipp_internal
    restart: "no"

  app:
    image: ghcr.io/eusoubrasileiro/ipp-sermons:${IMAGE_TAG:-latest}
    container_name: ipp-sermons-app
    env_file: .env
    environment:
      PORT: 3000
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_public"
      - "traefik.http.routers.ipp-sermons.rule=Host(`ipp-sermons.amiticia.cc`)"
      - "traefik.http.routers.ipp-sermons.entrypoints=websecure"
      - "traefik.http.routers.ipp-sermons.tls.certresolver=myresolver"
      - "traefik.http.services.ipp-sermons.loadbalancer.server.port=3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 384m
    networks:
      - ipp_internal
      - network_public
    restart: unless-stopped

volumes:
  pgdata:

networks:
  ipp_internal:
  network_public:
    external: true
