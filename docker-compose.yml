# Local dev stack. Production compose lives in deploy/docker-compose.yml.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ipp-sermons-db-dev
    environment:
      POSTGRES_USER: ipp
      POSTGRES_PASSWORD: ipp
      POSTGRES_DB: ipp_sermons
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipp -d ipp_sermons"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
